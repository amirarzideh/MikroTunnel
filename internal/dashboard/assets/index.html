<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MikroTunnel</title><link rel="stylesheet" href="/dashboard.css"></head>
<body><main class="shell"><header><a class="brand" href="/"><span class="brand-mark">M</span>MikroTunnel</a><div><label class="forward"><input id="ipv4-forward" type="checkbox"> IPv4 forward</label><span class="connection" id="connection">Loading</span><button class="quiet" id="refresh">Refresh</button><button class="primary" id="new-tunnel">Add tunnel</button></div></header><section class="tunnel-list" id="tunnels"><p class="empty">Loading tunnels…</p></section></main>
<dialog id="tunnel-dialog"><form method="dialog" class="dialog-card" id="tunnel-form"><button class="close" value="cancel" aria-label="Close">×</button><h2 id="tunnel-title">Add tunnel</h2><div class="fields"><label>Name<input name="name" required pattern="[A-Za-z][A-Za-z0-9_-]{0,14}" placeholder="gre-eu"></label><label>Interface address<input name="address" required placeholder="10.10.10.1/30"></label><label>Peer interface IP<input name="peer_address" required placeholder="10.10.10.2"></label><label>Local endpoint<input name="local_endpoint" required placeholder="198.51.100.10"></label><label>Remote endpoint<input name="remote_endpoint" required placeholder="203.0.113.20"></label><label>MTU<input name="mtu" type="number" min="576" max="9000" value="1476"></label><label>TTL<input name="ttl" type="number" min="1" max="255" value="255"></label></div><label>Description<input name="description" placeholder="Optional"></label><label><input name="masquerade" type="checkbox"> Masquerade outbound traffic through this tunnel</label><p class="form-error" id="form-error"></p><button class="primary" value="create" id="tunnel-submit">Create tunnel</button></form></dialog><script src="/dashboard.js"></script></body></html>
