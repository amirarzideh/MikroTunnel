name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go test ./...
      - name: Build release archive
        run: |
          mkdir -p dist/mikrotunnel-linux-${{ matrix.arch }}
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags='-s -w' -o dist/mikrotunnel-linux-${{ matrix.arch }}/mikrotunnel ./cmd/mikrotunnel
          cp deploy/systemd/mikrotunnel.service dist/mikrotunnel-linux-${{ matrix.arch }}/
          tar -C dist/mikrotunnel-linux-${{ matrix.arch }} -czf dist/mikrotunnel-linux-${{ matrix.arch }}.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
